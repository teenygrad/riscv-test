name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04-riscv]
    steps:
      - run: echo "hello from $(uname -m)"
      - uses: actions/checkout@v4
      - name: Build cpucaps
        run: gcc -O2 -Wall -o cpucaps cpucaps.c
      - name: Run cpucaps
        run: ./cpucaps
